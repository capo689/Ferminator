<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Set your password · Ferminator</title>
    <link rel="stylesheet" href="/static/design-tokens.css">
    <link rel="stylesheet" href="/static/app.css">
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Private beta</p>
        {% if done %}
          <h1>Password set</h1>
          <p>You can sign in now as <strong>{{ username }}</strong>.</p>
          <p><a href="/login">Go to sign in</a></p>
        {% else %}
          <h1>Set your password</h1>
          <p>Choose a new password. This link works once.</p>
          {% if error %}<div class="notice notice--error" role="alert">{{ error }}</div>{% endif %}
          <form method="post" action="/set-password" class="stack">
            <input type="hidden" name="token" value="{{ token }}">
            <label>New password
              <input type="password" name="password" autocomplete="new-password"
                     minlength="12" required autofocus>
            </label>
            <label>Confirm password
              <input type="password" name="confirm" autocomplete="new-password"
                     minlength="12" required>
            </label>
            <button type="submit">Set password</button>
          </form>
          <p class="muted">At least 12 characters.</p>
        {% endif %}
      </section>
    </main>
  </body>
</html>
