services:
  - type: web
    name: ferminator-web
    runtime: docker
    plan: starter
    branch: main
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: FERMINATOR_ENV
        value: production
      - key: FERMINATOR_DEMO_MODE
        value: "false"
      - key: FERMINATOR_AUTH_MODE
        value: supabase
      - key: PUBLIC_BASE_URL
        value: https://ferminator-web.onrender.com
      - key: FERMINATOR_ALPHA_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Beta bootstrap-only recovery location requested by the owner.
      # Supabase Auth stores the actual credential; the application never reads this.
      - key: FERMINATOR_SYSAD_PASSWORD
        sync: false
