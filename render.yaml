services:
  - type: web
    name: ferminator-web
    runtime: docker
    plan: starter
    branch: main
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass
    envVars:
      - key: FERMINATOR_ENV
        value: production
      - key: FERMINATOR_DEMO_MODE
        value: "false"
      - key: FERMINATOR_AUTH_MODE
        value: shared_password
      - key: FERMINATOR_ALPHA_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
