name: Production health monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

concurrency:
  group: ferminator-production-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps .

      - name: Verify production health and database readiness
        run: python scripts/smoke_deployment.py https://ferminator-web.onrender.com
