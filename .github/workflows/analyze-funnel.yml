name: Analyze match funnel

# Read-only diagnostic. Scores every active job for a profile in memory and
# reports which gateway rejected each one, so a matcher change can be measured
# against the live corpus before it is allowed to write stored matches.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Profile slug to analyze (works for database-backed accounts too)
        required: true
        default: adam-cagle
        type: string

concurrency:
  group: ferminator-analyze-funnel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps .

      - name: Score the corpus in memory
        env:
          DATABASE_URL: ${{ secrets.FERMINATOR_DATABASE_URL }}
          # Through env, never into the shell: a dispatch input is untrusted.
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          python scripts/analyze_match_funnel.py --slug "$SLUG" --samples 40 \
            | tee funnel.txt

      - name: Publish the funnel
        if: always()
        run: |
          {
            echo '## Match funnel'
            echo '```'
            cat funnel.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
