name: Sample geography rejections

# Read-only. Draws a stratified sample of Gateway 1 rejections and uploads it
# for human labelling. Nothing is written back to the database.

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Profile slug to sample
        required: true
        default: adam-cagle
        type: string
      size:
        description: How many records to sample
        required: true
        default: "100"
        type: string

concurrency:
  group: ferminator-sample-geography
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps .

      - name: Draw the sample
        env:
          DATABASE_URL: ${{ secrets.FERMINATOR_DATABASE_URL }}
          # Through env, never into the shell: dispatch inputs are untrusted.
          SLUG: ${{ inputs.slug }}
          SIZE: ${{ inputs.size }}
        run: |
          set -euo pipefail
          python scripts/sample_geography_rejections.py \
            --slug "$SLUG" --size "$SIZE" \
            --output sample/geography-rejections.md | tee strata.json

      - name: Publish the strata
        if: always()
        run: |
          {
            echo '## Geography rejection strata'
            echo '```json'
            cat strata.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: geography-rejections
          path: sample/geography-rejections.md
          retention-days: 14
