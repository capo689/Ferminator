name: Export unrated Discover jobs

# Renders a profile's currently visible, unrated Discover jobs as XML-tagged
# Markdown with the full job description for each, and uploads it as an
# artifact. Manual only.
#
# It runs here rather than on a laptop because the export needs the production
# database URL, which lives in this repository's secrets and does not need to
# be copied anywhere else to produce the file.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Profile Markdown to export, relative to the repo root
        required: true
        default: profiles/adam-cagle.md
        type: string

concurrency:
  group: ferminator-export-unrated
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps .

      - name: Render the export
        env:
          DATABASE_URL: ${{ secrets.FERMINATOR_DATABASE_URL }}
          # Through env, never interpolated into the shell, because
          # inputs.profile is attacker-controlled on workflow_dispatch.
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          python scripts/export_unrated_discover_xml.py \
            --database-url "$DATABASE_URL" \
            --profile "$PROFILE" \
            --output export/unrated-full-jds.md

      - name: Summarise
        run: |
          {
            echo "## Unrated Discover export"
            echo
            head -6 export/unrated-full-jds.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: unrated-full-jds
          path: export/unrated-full-jds.md
          retention-days: 7
