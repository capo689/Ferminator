name: Refresh profile matches

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Profile slug to rescore, or "all" for every active account
        required: true
        default: all
        type: string

concurrency:
  group: ferminator-rescore-${{ inputs.slug }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps .

      - name: Validate on-disk profiles and calibration gate
        run: |
          ferminator profile validate
          ferminator quality-eval

      - name: Refresh matches from shared corpus
        env:
          DATABASE_URL: ${{ secrets.FERMINATOR_DATABASE_URL }}
          # Through env, never interpolated into the shell. A dispatch input is
          # attacker-controlled text, and ${{ }} pastes it into the script
          # before bash ever sees it, so a slug containing shell syntax would
          # run as part of the command rather than be passed as an argument.
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          # The corpus is fetched once and every selected profile is scored
          # against it. No ATS boards are contacted.
          if [ "$SLUG" = "all" ]; then
            ferminator rescore
          else
            ferminator rescore --slug "$SLUG"
          fi
