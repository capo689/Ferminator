name: Refresh profile matches

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Profile slug to rescore, or "all" for every active account
        required: true
        default: all
        type: string

concurrency:
  group: ferminator-rescore-${{ inputs.slug }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps .

      - name: Validate on-disk profiles and calibration gate
        run: |
          ferminator profile validate
          ferminator quality-eval

      - name: Refresh matches from shared corpus
        env:
          DATABASE_URL: ${{ secrets.FERMINATOR_DATABASE_URL }}
        run: |
          # The corpus is fetched once and every selected profile is scored
          # against it. No ATS boards are contacted.
          if [ "${{ inputs.slug }}" = "all" ]; then
            ferminator rescore
          else
            ferminator rescore --slug "${{ inputs.slug }}"
          fi
