name: Scheduled ATS scan

on:
  workflow_dispatch:
    inputs:
      shard:
        description: Registry shard to scan
        required: true
        default: all
        type: choice
        options:
          - all
          - "1"
          - "2"
  schedule:
    # Two runs a day, 8:00 and 8:35 Pacific. America/Los_Angeles tracks the
    # PST/PDT transition, so these stay at 8am local year round.
    - cron: "0 8 * * *"
      timezone: America/Los_Angeles
    - cron: "35 8 * * *"
      timezone: America/Los_Angeles

concurrency:
  group: ferminator-scan
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps .

      - name: Validate configuration
        env:
          DATABASE_URL: ${{ secrets.FERMINATOR_DATABASE_URL }}
        run: |
          ferminator profile validate
          ferminator registry-validate

      - name: Ingest enabled boards
        env:
          DATABASE_URL: ${{ secrets.FERMINATOR_DATABASE_URL }}
          # Must match the cron strings above exactly. The 8:35 run takes
          # shard 2, the 8:00 run takes shard 1; if this string ever drifts
          # from the schedule, every run silently scans shard 1 and half the
          # registry stops updating.
          REQUESTED_SHARD: ${{ github.event_name == 'workflow_dispatch' && inputs.shard || (github.event.schedule == '35 8 * * *' && '2' || '1') }}
        run: |
          if [ "$REQUESTED_SHARD" = "all" ]; then
            ferminator scan --workers 16
          else
            ferminator scan --workers 16 --shard-index "$REQUESTED_SHARD" --shard-count 2
          fi

      - name: Publish scan summary
        if: always()
        run: |
          echo "## Ferminator scheduled scan" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Send ranked digests
        if: ${{ env.SMTP_HOST != '' }}
        env:
          DATABASE_URL: ${{ secrets.FERMINATOR_DATABASE_URL }}
          FERMINATOR_ADAM_EMAIL: ${{ secrets.FERMINATOR_ADAM_EMAIL }}
          SMTP_HOST: ${{ secrets.FERMINATOR_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.FERMINATOR_SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.FERMINATOR_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.FERMINATOR_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.FERMINATOR_SMTP_FROM }}
        run: ferminator digest --send
