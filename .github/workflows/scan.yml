name: Scheduled ATS scan

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2,14 * * *"

concurrency:
  group: ferminator-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked runtime
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps .

      - name: Validate configuration
        run: |
          ferminator profile validate
          ferminator registry-validate

      - name: Ingest enabled boards
        env:
          DATABASE_URL: ${{ secrets.FERMINATOR_DATABASE_URL }}
        run: ferminator scan
